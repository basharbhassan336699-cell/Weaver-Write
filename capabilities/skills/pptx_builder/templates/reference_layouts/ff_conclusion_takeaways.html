<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Conclusion with key takeaways</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');

  :root{
    /* === Theme Colors (extracted from Friends & Families deck) === */
    --bg-dark:      #191A2E;  /* main slide background */
    --bg-card:      #0F3460;  /* solid blue content card */
    --bg-card-2:    #1B1F3B;  /* darker outlined card (slide 5 style) */
    --accent-gold:  #E8A33D;  /* headings / subtitles */
    --accent-red:   #E84566;  /* crimson rule / top bar / numbered badges */
    --text-primary: #FFFFFF;
    --text-body:    #E7E9F1;
    --text-muted:   #B7BBD1;
    --deco-maroon:  #4E243C;  /* large decorative circle */
    --deco-brown:   #4F3D2C;  /* large decorative circle */
    --deco-navy:    #223257;  /* large decorative circle (overlap) */

    --font-heading: 'Poppins', sans-serif;
    --font-body:    'Inter', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1280px; height:720px; overflow:hidden; font-family:var(--font-body); background:var(--bg-dark); }
  .slide{ position:relative; width:1280px; height:720px; background:var(--bg-dark); overflow:hidden; text-align:left; color:var(--text-body); }

  .top-bar{ position:absolute; top:0; left:0; right:0; height:6px; background:var(--accent-red); }

  .page-title{ position:absolute; top:44px; left:64px; font-family:var(--font-heading); font-weight:800; font-size:44px; color:var(--text-primary); }
  .page-subtitle{ position:absolute; top:108px; left:64px; font-family:var(--font-body); font-style:italic; font-weight:400; font-size:18px; color:var(--accent-gold); }
  .title-rule{ position:absolute; top:150px; left:64px; width:420px; height:3px; background:var(--accent-red); }

  ul.plain{ list-style:none; }

  .summary-block{ position:absolute; top:190px; left:64px; right:64px; height:140px; background:var(--bg-card); padding:24px 32px; display:flex; align-items:center; }
  .summary-block p{ font-size:16px; color:var(--text-body); line-height:1.8; }

  .takeaways{ position:absolute; top:365px; left:64px; right:64px; bottom:40px; display:flex; flex-direction:column; justify-content:space-between; }
  .t-row{ display:flex; align-items:center; gap:20px; }
  .t-icon{
    width:44px; height:44px; border-radius:50%; background:var(--accent-red);
    display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
  }
  .t-row .label{ font-family:var(--font-heading); font-weight:700; font-size:16px; color:var(--accent-gold); min-width:160px; }
  .t-row .text{ font-size:16px; color:var(--text-body); }
</style>
</head>
<body>
  <div class="slide">
    <div class="top-bar"></div>
    <h1 class="page-title">{{TITLE}}</h1>
    <div class="page-subtitle">{{SUBTITLE}}</div>

    <div class="summary-block"><p>{{CONTENT_1}}</p></div>

    <div class="takeaways">
      <div class="t-row"><div class="t-icon">{{ICON_1}}</div><div class="label">{{TAKEAWAY_LABEL_1}}</div><div class="text">{{ITEM_1}}</div></div>
      <div class="t-row"><div class="t-icon">{{ICON_2}}</div><div class="label">{{TAKEAWAY_LABEL_2}}</div><div class="text">{{ITEM_2}}</div></div>
      <div class="t-row"><div class="t-icon">{{ICON_3}}</div><div class="label">{{TAKEAWAY_LABEL_3}}</div><div class="text">{{ITEM_3}}</div></div>
    </div>
  </div>
</body>
</html>
