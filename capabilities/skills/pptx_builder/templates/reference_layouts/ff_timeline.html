<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Numbered timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');

  :root{
    /* === Theme Colors (extracted from Friends & Families deck) === */
    --bg-dark:      #191A2E;  /* main slide background */
    --bg-card:      #0F3460;  /* solid blue content card */
    --bg-card-2:    #1B1F3B;  /* darker outlined card (slide 5 style) */
    --accent-gold:  #E8A33D;  /* headings / subtitles */
    --accent-red:   #E84566;  /* crimson rule / top bar / numbered badges */
    --text-primary: #FFFFFF;
    --text-body:    #E7E9F1;
    --text-muted:   #B7BBD1;
    --deco-maroon:  #4E243C;  /* large decorative circle */
    --deco-brown:   #4F3D2C;  /* large decorative circle */
    --deco-navy:    #223257;  /* large decorative circle (overlap) */

    --font-heading: 'Poppins', sans-serif;
    --font-body:    'Inter', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1280px; height:720px; overflow:hidden; font-family:var(--font-body); background:var(--bg-dark); }
  .slide{ position:relative; width:1280px; height:720px; background:var(--bg-dark); overflow:hidden; text-align:left; color:var(--text-body); }

  .top-bar{ position:absolute; top:0; left:0; right:0; height:6px; background:var(--accent-red); }

  .page-title{ position:absolute; top:44px; left:64px; font-family:var(--font-heading); font-weight:800; font-size:44px; color:var(--text-primary); }
  .page-subtitle{ position:absolute; top:108px; left:64px; font-family:var(--font-body); font-style:italic; font-weight:400; font-size:18px; color:var(--accent-gold); }
  .title-rule{ position:absolute; top:150px; left:64px; width:420px; height:3px; background:var(--accent-red); }

  ul.plain{ list-style:none; }

  .timeline{ position:absolute; top:210px; left:64px; right:64px; bottom:50px; }
  .t-item{ position:relative; display:flex; gap:24px; padding-bottom:56px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-badge{
    width:56px; height:56px; border-radius:50%; background:var(--accent-red);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:var(--font-heading); font-weight:800; font-size:22px; color:var(--text-primary);
    position:relative; z-index:2;
  }
  .t-connector{ position:absolute; top:56px; left:27px; width:2px; height:calc(100% - 56px); background:var(--accent-red); opacity:0.55; z-index:1; }
  .t-body h3{ font-family:var(--font-heading); font-weight:700; font-size:19px; color:var(--accent-gold); margin-bottom:8px; }
  .t-body h3 .emoji{ margin-left:8px; }
  .t-body p{ font-size:15px; color:var(--text-body); line-height:1.7; max-width:900px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="top-bar"></div>
    <h1 class="page-title">{{TITLE}}</h1>
    <div class="page-subtitle">{{SUBTITLE}}</div>

    <div class="timeline">
      <div class="t-item">
        <div class="t-connector"></div>
        <div class="t-badge">1</div>
        <div class="t-body"><h3><span class="emoji">{{ICON_1}}</span>{{STEP_TITLE_1}}</h3><p>{{CONTENT_1}}</p></div>
      </div>
      <div class="t-item">
        <div class="t-connector"></div>
        <div class="t-badge">2</div>
        <div class="t-body"><h3><span class="emoji">{{ICON_2}}</span>{{STEP_TITLE_2}}</h3><p>{{CONTENT_2}}</p></div>
      </div>
      <div class="t-item">
        <div class="t-badge">3</div>
        <div class="t-body"><h3><span class="emoji">{{ICON_3}}</span>{{STEP_TITLE_3}}</h3><p>{{CONTENT_3}}</p></div>
      </div>
    </div>
  </div>
</body>
</html>
