<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Neon Tech Grid</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --bg:        #0B0E14;
    --panel:     #10151F;
    --grid-line: rgba(0,255,194,0.08);
    --neon:      #00FFC2;
    --neon-2:    #7A5CFF;
    --text:      #E7EEF3;
    --muted:     #8593A6;
    --font-heading: 'Cairo', sans-serif;
    --font-body:    'Tajawal', sans-serif;
    --font-mono:    'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1280px; height:720px; overflow:hidden; background:var(--bg); font-family:var(--font-body); color:var(--text); }
  .slide{ position:relative; width:1280px; height:720px; direction:rtl; text-align:right; }

  /* signature motif: technical grid backdrop */
  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .scanline{ position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--neon),transparent); opacity:0.5; }

  .tag{
    position:absolute; top:44px; right:60px;
    font-family:var(--font-mono); font-size:12px; color:var(--neon); letter-spacing:2px;
    border:1px solid rgba(0,255,194,0.4); border-radius:20px; padding:6px 18px;
  }
  .tag::before{ content:"// "; color:var(--neon-2); }

  .title{
    position:absolute; top:100px; right:60px; left:60px;
    font-family:var(--font-heading); font-weight:800; font-size:46px; color:var(--text);
  }
  .title span{ color:var(--neon); }

  .rule{ position:absolute; top:180px; right:60px; width:120px; height:3px; background:var(--neon); }

  .panels{ position:absolute; top:220px; right:60px; left:60px; bottom:56px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .panel{
    background:var(--panel); border:1px solid rgba(0,255,194,0.18); border-radius:10px;
    padding:24px; position:relative; overflow:hidden;
  }
  .panel::after{ content:""; position:absolute; top:0; right:0; width:34px; height:34px; border-top:2px solid var(--neon); border-right:2px solid var(--neon); border-radius:0 10px 0 0; }
  .panel .num{ font-family:var(--font-mono); font-size:13px; color:var(--neon-2); margin-bottom:14px; }
  .panel h4{ font-family:var(--font-heading); font-weight:700; font-size:18px; color:var(--text); margin-bottom:12px; }
  .panel p{ font-size:13.5px; color:var(--muted); line-height:1.8; }

  .page-num{ position:absolute; bottom:20px; left:60px; font-family:var(--font-mono); font-size:12px; color:var(--neon); }
  .footer-label{ position:absolute; bottom:20px; right:60px; font-family:var(--font-mono); font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="slide">
    <div class="grid-bg"></div>
    <div class="scanline"></div>

    <div class="tag">{{KICKER}}</div>
    <h1 class="title">{{TITLE_PART_1}} <span>{{TITLE_PART_2}}</span></h1>
    <div class="rule"></div>

    <div class="panels">
      <div class="panel"><div class="num">{{ITEM_NUM_1}}</div><h4>{{SUBTITLE_1}}</h4><p>{{CONTENT_1}}</p></div>
      <div class="panel"><div class="num">{{ITEM_NUM_2}}</div><h4>{{SUBTITLE_2}}</h4><p>{{CONTENT_2}}</p></div>
      <div class="panel"><div class="num">{{ITEM_NUM_3}}</div><h4>{{SUBTITLE_3}}</h4><p>{{CONTENT_3}}</p></div>
    </div>

    <div class="footer-label">{{FOOTER_LABEL}}</div>
    <div class="page-num">{{PAGE_NUM}}</div>
  </div>
</body>
</html>
