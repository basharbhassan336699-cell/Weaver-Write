<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>فاصل قسم - شريط عنوان</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap');

  :root{
    /* === Theme Colors (extracted) === */
    --bg-dark:        #0a0523;  /* main slide background (dark navy/black) */
    --bg-primary:     #331263;  /* solid purple panel / divider slides */
    --bg-card:        #140a33;  /* card fill, slightly lighter than bg-dark */
    --bg-pill:        #4a1a8a;  /* small label pill fill */
    --accent-gold:    #d9ac3d;  /* gold rule / border / accent text */
    --accent-gold-2:  #f2c744;  /* brighter gold for numbers/badges */
    --accent-purple:  #8b5cf6;  /* bright purple card border */
    --accent-purple-2:#b28ee0;  /* light purple text / italic tagline */
    --text-primary:   #ffffff;
    --text-body:      #eae6f2;
    --text-muted:     #cfc7e0;
    --border-gold:    rgba(217,172,61,0.55);
    --border-purple:  rgba(139,92,246,0.6);

    --font-heading: 'Cairo', 'Tajawal', sans-serif;
    --font-body:    'Tajawal', 'Cairo', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1280px; height:720px; overflow:hidden; font-family:var(--font-body); background:var(--bg-dark); }
  .slide{ position:relative; width:1280px; height:720px; background:var(--bg-dark); overflow:hidden; direction:rtl; text-align:right; }

  /* breadcrumb / label pill, top-right */
  .crumb-pill{
    position:absolute; top:32px; right:56px;
    background:var(--bg-pill); border:1.5px solid var(--accent-gold);
    border-radius:24px; padding:10px 26px;
    font-size:14px; color:var(--accent-gold-2); font-family:var(--font-heading);
  }

  /* page heading + gold underline */
  .page-title{
    position:absolute; top:78px; right:56px; left:56px;
    font-family:var(--font-heading); font-weight:800; font-size:38px;
    color:var(--text-primary);
  }
  .page-rule{
    position:absolute; top:150px; right:40px; left:40px;
    height:2px; background:var(--accent-gold);
  }

  .page-num{
    position:absolute; bottom:16px; right:26px;
    font-family:var(--font-heading); font-weight:700; font-size:15px;
    color:var(--accent-gold-2);
  }

  ul.bullets{ list-style:none; }
  ul.bullets li{ position:relative; padding-right:26px; margin-bottom:14px; font-size:15px; color:var(--text-body); line-height:1.6; }
  ul.bullets li::before{ content:""; position:absolute; right:0; top:6px; width:11px; height:11px; border-radius:50%; background:var(--accent-gold-2); }
  ul.bullets.purple li::before{ background:var(--accent-purple-2); }

  .card{ background:var(--bg-card); border:1.5px solid var(--border-gold); border-radius:14px; }
  .card.purple{ border-color:var(--border-purple); }

  .slide{ background:var(--bg-primary); }
  .rings-decor{ position:absolute; inset:0; overflow:hidden; }
  .rings-decor svg{ position:absolute; }

  .hex{ position:absolute; width:150px; height:150px; }
  .hex.top{ top:40px; right:calc(50% - 75px); }
  .hex.bottom{ bottom:60px; right:170px; }

  .crumb-label{ position:absolute; top:270px; left:0; right:0; text-align:center; font-size:18px; color:var(--accent-gold); }

  .title-banner{
    position:absolute; top:318px; left:0; right:0; height:145px;
    background:rgba(74,26,138,0.55);
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .title-banner h1{ font-family:var(--font-heading); font-weight:800; font-size:48px; color:var(--text-primary); line-height:1.3; }

  .sub-line{ position:absolute; top:490px; left:0; right:0; text-align:center; }
  .sub-line .accent-title{ font-family:var(--font-heading); font-weight:800; font-size:44px; color:var(--accent-gold); }

  .rule-center{ position:absolute; top:598px; left:calc(50% - 230px); width:460px; height:2px; background:var(--accent-gold); }
  .footer-line{ position:absolute; top:618px; left:0; right:0; text-align:center; font-size:15px; color:var(--text-body); }
</style>
</head>
<body>
  <div class="slide">
    <div class="hex top">
      <svg viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg"><polygon points="50,2 95,28 95,86 50,113 5,86 5,28" fill="none" stroke="#d9ac3d" stroke-width="2.5"/></svg>
    </div>
    <div class="hex bottom">
      <svg viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg"><polygon points="50,2 95,28 95,86 50,113 5,86 5,28" fill="none" stroke="#8b5cf6" stroke-width="2.5"/></svg>
    </div>

    <div class="crumb-label">{{BREADCRUMB}}</div>
    <div class="title-banner"><h1>{{TITLE_LINE_1}}</h1></div>
    <div class="sub-line"><span class="accent-title">{{TITLE_LINE_2}}</span></div>
    <div class="rule-center"></div>
    <div class="footer-line">{{CONTENT_1}}</div>

    <div class="page-num">{{PAGE_NUM}}</div>
  </div>
</body>
</html>
